[package]
name = "qfind"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Fast parallel literal search for terminals and AI agents"
license = "MIT"

[dependencies]
base64 = "0.22"
clap = { version = "4.6", features = ["derive"] }
ignore = "0.4"
memchr = "2.8"
regex = "1.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
tempfile = "3.27"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

